name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: save log
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          grep -E "error:|warning:|\.java:[0-9]+|What went wrong|^> |Caused by|Exception" build.log | head -400 > /tmp/errors.txt || true
          grep -A6 "error:" build.log | head -300 > /tmp/compile.txt || true
          tail -300 build.log > /tmp/tail.txt
          JAR=$(find ~/.gradle .gradle -name "minecraft-merged.jar" 2>/dev/null | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -name "minecraft-*.jar" -size +5M 2>/dev/null | grep -v sources | head -1)
          echo "jar: $JAR" > /tmp/sigs.txt
          for c in $(cat .github/sigs.txt); do
            javap -p -cp "$JAR" $c >> /tmp/sigs.txt 2>&1 || true
          done
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/errors.txt /tmp/compile.txt /tmp/tail.txt /tmp/sigs.txt .
          git add errors.txt tail.txt compile.txt sigs.txt
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: mineassist-jar
          path: build/libs/
      - name: release
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mine Assist (build ${{ github.run_number }})
          body: "Fabric 26.2용 Mine Assist. 아래 jar 파일을 받아 mods 폴더에 넣으세요. (Fabric API 필요, Mod Menu 권장)"
          files: build/libs/*.jar
